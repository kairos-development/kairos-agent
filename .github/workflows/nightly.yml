name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          git clone --depth 1 https://github.com/kairos-development/kairos-contracts.git "$GITHUB_WORKSPACE/deps/kairos-contracts"
          git clone --depth 1 https://github.com/kairos-development/kairos-connectors.git "$GITHUB_WORKSPACE/deps/kairos-connectors"
          sed -i "s|=> \.\./|=> $GITHUB_WORKSPACE/deps/|g" go.mod

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run integration tests
        run: go test -v -tags=integration -race ./...

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          git clone --depth 1 https://github.com/kairos-development/kairos-contracts.git "$GITHUB_WORKSPACE/deps/kairos-contracts"
          git clone --depth 1 https://github.com/kairos-development/kairos-connectors.git "$GITHUB_WORKSPACE/deps/kairos-connectors"
          sed -i "s|=> \.\./|=> $GITHUB_WORKSPACE/deps/|g" go.mod

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run E2E tests
        run: go test -v -tags=e2e -race ./test/e2e/...

  chaos:
    name: Chaos Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          git clone --depth 1 https://github.com/kairos-development/kairos-contracts.git "$GITHUB_WORKSPACE/deps/kairos-contracts"
          git clone --depth 1 https://github.com/kairos-development/kairos-connectors.git "$GITHUB_WORKSPACE/deps/kairos-connectors"
          sed -i "s|=> \.\./|=> $GITHUB_WORKSPACE/deps/|g" go.mod

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run chaos tests
        run: go test -v -tags=chaos -race ./...
