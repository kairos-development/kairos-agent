name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          git clone --depth 1 https://github.com/kairos-development/kairos-contracts.git "$GITHUB_WORKSPACE/deps/kairos-contracts"
          git clone --depth 1 https://github.com/kairos-development/kairos-connectors.git "$GITHUB_WORKSPACE/deps/kairos-connectors"
          sed -i "s|=> \.\./|=> $GITHUB_WORKSPACE/deps/|g" go.mod

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -fmt sarif -out gosec.sarif ./... || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec.sarif
